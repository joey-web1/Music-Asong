<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musciApp</title>
    <link rel="manifest" href="manifest.json">

    <style>
        
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container {
        max-width: 375px;
        margin: 0 auto;
    }
    .nav-con {
        text-align: center;
        background-color: red;
        color: white;
        font-family: sans-serif;
        padding: 5px;
        margin: 0 10px;
        border-radius: 10px;
    }
    .show {
        display: flex;
        justify-content: space-between;
        margin: 5px 10px;
        font-family: Arial;
        font-size: 17px;
        align-items: center;
    }
    .show h1 {
        border: 2px solid red;
        border-radius: 10px;
        padding: 0 5px;
    }
    .show img {
        height: 75px;
        width: 85px;
        border-radius: 50%;
        border: 2px solid rgb(131, 128, 128);
    }
    .itemmusic {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        text-align: center;
        margin: 5px 10px;
    }
    audio {
        width: 100%;
    }
    .item1 , .item3 {
        background-color: rgb(223, 218, 218);
        border-radius: 10px;
        font-family: sans-serif;
    }
    .item1 img , .item3 img {
        width: 100%;
        padding: 10px;
        height: 150px;
    }
    .item2 , .item4 {
        margin-left: 5px;
        background-color: rgb(223, 218, 218);
        border-radius: 10px;
        font-family: sans-serif;
    }
    .item2 img , .item4 img {
        width: 100%;
        padding: 10px;
        height: 150px;
        background-position: cover;
    }

    </style>

</head>
<body>

    <nav>
        <div class="container">
            <div class="nav-con">
                <h3>Music</h3>
                <p>แอพเถื่อน.com</p>
            </div>
        </div>
    </nav>

    <section>
        <div class="container">
            <div class="show">
                <h1>เพลง</h1>
                <img src="ARXX1080.JPG" alt="cover">
            </div>
        </div>
    </section>

    <main>
        <div class="container">
            <div class="itemmusic">
                <div class="item1">
                    <img src="img1.png" alt="cover">
                    <h3>ปากอง เพื่อชีวิต</h3>
                    <p>ปากองเพชรบุรี</p>

                    <audio controls>
                        <source src="m1.mp3" type="audio/mpeg">
                    </audio>
                </div>

                <div class="item2">
                    <img src="img2.png" alt="cover">
                    <h3>รวม Dr.Fuu</h3>
                    <p>Dr.Fuu</p>

                    <audio controls>
                        <source src="m2.mp3" type="audio/mpeg">
                    </audio>
                </div>

                <div class="item3">
                    <img src="img3.png" alt="cover">
                    <h3>รวม Rock90</h3>
                    <p>Rock 90</p>

                    <audio controls>
                        <source src="m3.mp3" type="audio/mpeg">
                    </audio>
                </div>

                <div class="item4">
                    <img src="" alt="cover">
                    <h3>รวม Dr.Fuu</h3>
                    <p>Dr.Fuu</p>

                    <audio controls>
                        <source src="" type="audio/mpeg">
                    </audio>
                </div>
            </div>
        </div>
    </main>

    <script src="service-worker.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('PWA Ready!', reg))
                .catch(err => console.log('PWA Failed', err));
            });
        }
    </script>
    
</body>
</html>
